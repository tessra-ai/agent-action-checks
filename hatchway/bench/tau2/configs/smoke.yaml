# Smoke test for the pilot: 2 simulations per model per domain.
# Generated by scripts/select_pilot_tasks.py; edit the script, not this file.
# Agent + user cost estimate: ~$0.013 per gpt-4.1-mini simulation,
# scaled by model input price. Central: the agent is 70% of a simulation's cost;
# upper bound: all of it at the dearer model. Not measured per domain (telecom
# conversations may run longer). Judge scoring is not included.
#   retail/gpt-4.1-nano-2025-04-14: 2 simulations, $0.01 central, $0.03 upper bound
#   retail/gpt-4.1-mini-2025-04-14: 2 simulations, $0.03 central, $0.03 upper bound
#   retail/gpt-4.1-2025-04-14: 2 simulations, $0.10 central, $0.13 upper bound
#   telecom/gpt-4.1-nano-2025-04-14: 2 simulations, $0.01 central, $0.03 upper bound
#   telecom/gpt-4.1-mini-2025-04-14: 2 simulations, $0.03 central, $0.03 upper bound
#   telecom/gpt-4.1-2025-04-14: 2 simulations, $0.10 central, $0.13 upper bound
#   total: 12 simulations, $0.27 central, $0.36 upper bound
name: smoke
domains:
  retail:
    task_split: base
    write_task_ids:
    - '13'
    no_write_task_ids:
    - '10'
  telecom:
    task_split: base
    write_task_ids:
    - '[mobile_data_issue]bad_vpn|data_mode_off|data_usage_exceeded|user_abroad_roaming_disabled_off[PERSONA:None]'
    no_write_task_ids:
    - '[mms_issue]break_app_sms_permission|data_mode_off[PERSONA:None]'
agent_models:
- gpt-4.1-nano-2025-04-14
- gpt-4.1-mini-2025-04-14
- gpt-4.1-2025-04-14
user_model: gpt-4.1-mini-2025-04-14
trials: 1
seed: 300
temperature: 0.0
max_steps: 200
max_concurrency: 4
spend_cap_usd: 1.0
cost_estimate:
  central_usd: 0.27
  upper_bound_usd: 0.36
